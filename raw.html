<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NN | RAW GENERATOR</title>
<meta name="description" content="LuaやテキストをRaw形式で扱うためのジェネレーター。">
<link rel="icon" type="image/png" href="assets/N.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">

<!-- 既存サイトの style.css をそのまま読み込む -->
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="raw-generator.css">
</head>
<body data-page="raw.html">

<div class="bg-decor" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="blob b4"></span>

  <span class="sparkle s1"><svg viewBox="0 0 24 24"><path d="M12 0C12 6 6 12 0 12C6 12 12 18 12 24C12 18 18 12 24 12C18 12 12 6 12 0Z" fill="#97E7FE"/></svg></span>
  <span class="sparkle s2"><svg viewBox="0 0 24 24"><path d="M12 0C12 6 6 12 0 12C6 12 12 18 12 24C12 18 18 12 24 12C18 12 12 6 12 0Z" fill="#FD99CB"/></svg></span>
  <span class="sparkle s3"><svg viewBox="0 0 24 24"><path d="M12 0C12 6 6 12 0 12C6 12 12 18 12 24C12 18 18 12 24 12C18 12 12 6 12 0Z" fill="#9892FC"/></svg></span>
  <span class="sparkle s4"><svg viewBox="0 0 24 24"><path d="M12 0C12 6 6 12 0 12C6 12 12 18 12 24C12 18 18 12 24 12C18 12 12 6 12 0Z" fill="#FED44E"/></svg></span>
  <span class="sparkle s5"><svg viewBox="0 0 24 24"><path d="M12 0C12 6 6 12 0 12C6 12 12 18 12 24C12 18 18 12 24 12C18 12 12 6 12 0Z" fill="#4BA3FD"/></svg></span>
  <span class="sparkle s6"><svg viewBox="0 0 24 24"><path d="M12 0C12 6 6 12 0 12C6 12 12 18 12 24C12 18 18 12 24 12C18 12 12 6 12 0Z" fill="#FD99CB"/></svg></span>
</div>

<div class="page">
  <header class="topbar">
    <a class="topbar__logo" href="index.html" aria-label="NN HOME">
      <img src="assets/N.png" alt="NN | NaNox アイコン">
    </a>
    <div class="topbar__title">NN<small>公式サーバーサイト</small></div>
  </header>

  <section class="page-head reveal">
    <div class="icon-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m8 6-5 6 5 6"/><path d="m16 6 5 6-5 6"/><path d="m14 4-4 16"/>
      </svg>
    </div>
    <h1>RAW GENERATOR</h1>
    <p>LuaやテキストをRaw形式で扱うためのジェネレーターです。<br>Enterでも生成できます。</p>
  </section>

  <section class="section reveal">
    <span class="tab-label purple"><span class="dot">📝</span>INPUT</span>
    <div class="ticket-card">
      <label class="raw-label" for="rawInput">コード / テキスト</label>
      <textarea id="rawInput" class="raw-editor" spellcheck="false"
        placeholder='print("Hello World")'></textarea>
      <div class="editor-meta">
        <span id="charCount">0 文字</span>
        <span>Enterで生成 / Shift + Enterで改行</span>
      </div>
    </div>
  </section>

  <section class="section reveal">
    <span class="tab-label yellow"><span class="dot">⚙️</span>OPTIONS</span>
    <div class="ticket-card">
      <div class="option-list">

        <label class="option-row">
          <span class="option-copy">
            <strong>そのまま使えるようにする</strong>
            <small>loadstring(game:HttpGet(""))()で囲う</small>
          </span>
          <input id="wrapLoadstring" type="checkbox">
          <span class="switch" aria-hidden="true"></span>
        </label>

        <label class="option-row">
          <span class="option-copy">
            <strong>ファイル名を指定</strong>
            <small>未指定の場合は自動生成します。</small>
          </span>
          <input id="customNameToggle" type="checkbox">
          <span class="switch" aria-hidden="true"></span>
        </label>

      </div>

      <div id="filenameBox" class="filename-box" hidden>
        <label class="raw-label" for="filename">ファイル名</label>
        <div class="filename-row">
          <input id="filename" class="raw-input" type="text" maxlength="48" placeholder="script">
          <span class="filename-ext">.lua</span>
        </div>
      </div>

      <button id="createRaw" class="btn btn--primary raw-create" type="button">
        <span>✨</span> RAWを生成する
      </button>
    </div>
  </section>

  <section id="resultSection" class="section reveal">
    <span class="tab-label cyan"><span class="dot">🔗</span>RESULT</span>
    <div class="ticket-card">
      <div class="result-card">
        <div class="result-status">
          <span class="status-dot"></span>
          <span>生成完了</span>
        </div>

        <p class="desc-box">生成したRawリンクです。コピーして利用できます。</p>

        <div class="url-box">
          <code id="rawUrl">https://example.com/raw/xxxxx.lua</code>
        </div>

        <div class="result-actions">
          <button id="copyUrl" class="copy-btn" type="button">📋 コピー</button>
          <a id="openRaw"
             class="btn btn--ghost btn--sm"
             href="#"
             target="_blank"
             rel="noopener">
            ↗ Rawを開く
          </a>
        </div>

      </div>
    </div>
  </section>

  <p class="footer-note">NN | RAW GENERATOR</p>

  <nav class="bottom-nav" aria-label="ページナビゲーション">
    <a class="nav-item" href="index.html" data-page="index.html">
      <span class="nav-item__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5 12 3l9 6.5"/>
          <path d="M5 9v10a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1V9"/>
        </svg>
      </span>
      HOME
    </a>

    <a class="nav-item" href="st.html" data-page="st.html">
      <span class="nav-item__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11.5 4.5"/>
          <path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07L12.5 19.5"/>
        </svg>
      </span>
      SITE
    </a>

    <a class="nav-item" href="cm.html" data-page="cm.html">
      <span class="nav-item__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 20v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1"/>
          <circle cx="10" cy="7" r="3.2"/>
          <path d="M22 20v-1a4 4 0 0 0-2.6-3.75"/>
          <path d="M15.5 4.3A3.2 3.2 0 0 1 18 7.4a3.2 3.2 0 0 1-1.9 2.93"/>
        </svg>
      </span>
      COMMUNITY
    </a>

    <a class="nav-item" href="sc.html" data-page="sc.html">
      <span class="nav-item__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m8 6-5 6 5 6"/>
          <path d="m16 6 5 6-5 6"/>
        </svg>
      </span>
      SCRIPT
    </a>
  </nav>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="main.js"></script>
<script src="raw-generator.js"></script>
</body>
</html>
